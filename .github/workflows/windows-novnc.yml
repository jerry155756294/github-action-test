name: Windows noVNC Remote Desktop

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: 'VNC Password (8 characters recommended)'
        required: true
        default: 'password'

jobs:
  windows-novnc:
    runs-on: windows-latest
    timeout-minutes: 360  # 6 hours max

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download and Install TightVNC
        shell: powershell
        run: |
          Write-Host "Downloading TightVNC..."
          $tightvncUrl = "https://www.tightvnc.com/download/2.8.85/tightvnc-2.8.85-gpl-setup-64bit.msi"
          $tightvncInstaller = "$env:TEMP\tightvnc-installer.msi"
          Invoke-WebRequest -Uri $tightvncUrl -OutFile $tightvncInstaller

          Write-Host "Installing TightVNC silently..."
          Start-Process msiexec.exe -ArgumentList "/i `"$tightvncInstaller`" /quiet /norestart ADDLOCAL=Server SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=${{ github.event.inputs.vnc_password }} SET_VIEWONLYPASSWORD=1 VALUE_OF_VIEWONLYPASSWORD=${{ github.event.inputs.vnc_password }}" -Wait

          Write-Host "TightVNC installed successfully"

      - name: Configure and Start TightVNC Server
        shell: powershell
        run: |
          Write-Host "Starting TightVNC Server..."
          $vncServer = "C:\Program Files\TightVNC\tvnserver.exe"

          # Start VNC server as application (not service)
          Start-Process -FilePath $vncServer -ArgumentList "-run" -WindowStyle Hidden

          Write-Host "Waiting for VNC server to start..."
          Start-Sleep -Seconds 10

          Write-Host "VNC Server is running on port 5900"

      - name: Download and Setup noVNC
        shell: powershell
        run: |
          Write-Host "Cloning noVNC..."
          git clone https://github.com/novnc/noVNC.git C:\novnc

          Write-Host "Installing websockify..."
          python -m pip install websockify

          Write-Host "noVNC setup complete"

      - name: Install and Setup ngrok
        shell: powershell
        run: |
          Write-Host "Downloading ngrok..."
          $ngrokUrl = "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip"
          $ngrokZip = "$env:TEMP\ngrok.zip"
          Invoke-WebRequest -Uri $ngrokUrl -OutFile $ngrokZip

          Write-Host "Extracting ngrok..."
          Expand-Archive -Path $ngrokZip -DestinationPath "C:\ngrok" -Force

          Write-Host "ngrok installed to C:\ngrok"

      - name: Configure ngrok (if token provided)
        if: secrets.NGROK_AUTH_TOKEN != ''
        shell: powershell
        run: |
          Write-Host "Configuring ngrok with auth token..."
          & "C:\ngrok\ngrok.exe" config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Start websockify (noVNC proxy)
        shell: powershell
        run: |
          Write-Host "Starting websockify..."
          Start-Process -FilePath "python" -ArgumentList "-m websockify --web C:\novnc 6080 localhost:5900" -WindowStyle Hidden

          Write-Host "Waiting for websockify to start..."
          Start-Sleep -Seconds 5

          Write-Host "websockify is running on port 6080"

      - name: Start ngrok tunnel for noVNC
        shell: powershell
        run: |
          Write-Host "Starting ngrok tunnel for noVNC (HTTP on port 6080)..."
          Start-Process -FilePath "C:\ngrok\ngrok.exe" -ArgumentList "http 6080 --log=stdout" -WindowStyle Hidden -RedirectStandardOutput "C:\ngrok-log.txt"

          Write-Host "Waiting for ngrok to establish tunnel..."
          Start-Sleep -Seconds 10

      - name: Get ngrok Public URL
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "Fetching ngrok public URL..."

          try {
            $response = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -Method Get
            $publicUrl = $response.tunnels[0].public_url

            Write-Host ""
            Write-Host "========================================="
            Write-Host "🎉 noVNC is ready!"
            Write-Host "========================================="
            Write-Host ""
            Write-Host "Access your Windows desktop in browser:"
            Write-Host "URL: $publicUrl/vnc.html"
            Write-Host ""
            Write-Host "Connection Details:"
            Write-Host "  - Host: Use the ngrok URL above"
            Write-Host "  - Port: 443 (ngrok handles forwarding)"
            Write-Host "  - Password: ${{ github.event.inputs.vnc_password }}"
            Write-Host ""
            Write-Host "========================================="
            Write-Host "⚠️  This session will remain active until:"
            Write-Host "    1. You cancel this workflow manually, OR"
            Write-Host "    2. The 6-hour timeout is reached"
            Write-Host "========================================="
            Write-Host ""

            # Save URL to file for easy access
            $publicUrl | Out-File -FilePath "C:\novnc-url.txt"

          } catch {
            Write-Host "Failed to get ngrok URL. Check if ngrok started correctly."
            Write-Host "Error: $_"

            # Show ngrok log if available
            if (Test-Path "C:\ngrok-log.txt") {
              Write-Host ""
              Write-Host "ngrok log:"
              Get-Content "C:\ngrok-log.txt"
            }
          }

      - name: Keep session alive
        shell: powershell
        run: |
          Write-Host "Session is active. Press Ctrl+C in Actions to terminate."
          Write-Host ""
          Write-Host "Checking connection status every 5 minutes..."

          $counter = 0
          while ($true) {
            Start-Sleep -Seconds 300  # 5 minutes
            $counter += 5

            Write-Host "[$counter min] Session still active..."

            # Check if VNC is still running
            $vncProcess = Get-Process -Name "tvnserver" -ErrorAction SilentlyContinue
            if (-not $vncProcess) {
              Write-Host "⚠️  VNC server stopped unexpectedly!"
              break
            }

            # Try to get ngrok URL again
            try {
              $response = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -Method Get -ErrorAction SilentlyContinue
              $publicUrl = $response.tunnels[0].public_url
              Write-Host "🌐 Current URL: $publicUrl/vnc.html"
            } catch {
              Write-Host "⚠️  ngrok tunnel may have disconnected"
            }
          }
